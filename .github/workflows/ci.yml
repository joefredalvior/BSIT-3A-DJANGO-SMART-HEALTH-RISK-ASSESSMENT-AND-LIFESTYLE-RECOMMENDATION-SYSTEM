name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Django==5.0.14 openpyxl pytest pytest-django pytest-cov python-dotenv

      - name: Django checks
        run: python manage.py check --deploy || python manage.py check

      - name: Tests
        run: pytest --cov=apps --cov-report=term-missing
