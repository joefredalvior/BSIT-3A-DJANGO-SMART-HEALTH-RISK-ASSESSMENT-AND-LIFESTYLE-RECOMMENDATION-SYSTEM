name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Production deployment checks
        env:
          DJANGO_SETTINGS_MODULE: mysite.settings_production
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-key-change-me-0123456789abcdef
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://example.com
          DJANGO_HSTS_PRELOAD: '1'
          SITE_URL: https://example.com
        run: python manage.py check --deploy --fail-level WARNING

      - name: Tests
        run: python manage.py test --verbosity 2
